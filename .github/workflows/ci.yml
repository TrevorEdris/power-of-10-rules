name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py3.9 / ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Print Python version
        run: python3 --version

      - name: Validate core JSON (stub)
        run: python3 tools/validate.py

      - name: Run generator (stub)
        run: python3 tools/generate.py

      - name: Run unit tests
        run: python3 -m unittest discover tests

      - name: Verify no drift
        run: python3 tools/verify_no_drift.py
