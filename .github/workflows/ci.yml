name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    name: lint markdown + validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/claude-code/.claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
            echo "ok: $f"
          done

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            **/*.mdc
            !LICENSE

      - name: Verify per-rule skill set is complete
        run: |
          set -e
          for n in 01 02 03 04 05 06 07 08 09 10; do
            for plugin in claude-code cursor codex; do
              case $plugin in
                claude-code) test -f plugins/claude-code/skills/pow10-rule-${n}-*/SKILL.md ;;
                cursor)      test -f plugins/cursor/.cursor/rules/pow10-rule-${n}-*.mdc ;;
                codex)       test -f plugins/codex/prompts/pow10-rule-${n}-*.md ;;
              esac
            done
          done
          echo "All 10 rules present in all 3 plugins."

      - name: Enforce 200-line SKILL.md limit
        run: |
          set -e
          fail=0
          for f in plugins/claude-code/skills/*/SKILL.md plugins/cursor/.cursor/rules/*.mdc plugins/codex/prompts/*.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 200 ]; then
              echo "FAIL: $f has $lines lines (>200). Split per-language into references/. See CONTRIBUTING.md."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All skill files under 200 lines."
          exit $fail

      - name: Dead-link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-redirects 5 './**/*.md' './**/*.mdc'
          fail: false
