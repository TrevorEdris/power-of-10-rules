name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint markdown + validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
            echo "ok: $f"
          done

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !LICENSE

      - name: Verify all 10 per-rule skills are present
        run: |
          set -e
          for n in 01 02 03 04 05 06 07 08 09 10; do
            test -f skills/pow10-rule-${n}-*/SKILL.md
          done
          echo "All 10 rule skills present."

      - name: Verify slash commands + auditor agent
        run: |
          set -e
          test -f commands/pow10-overview.md
          test -f commands/pow10-review.md
          test -f agents/pow10-auditor.md
          echo "Commands + agent present."

      - name: Enforce 200-line SKILL.md limit
        run: |
          set -e
          fail=0
          for f in skills/*/SKILL.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 200 ]; then
              echo "FAIL: $f has $lines lines (>200). Split per-language into references/. See CONTRIBUTING.md."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All skill files under 200 lines."
          exit $fail

      - name: Dead-link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-redirects 5 './**/*.md'
          fail: false
