name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: validate plugin layout + markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
            echo "ok: $f"
          done

      - name: Structural validator (layout, frontmatter, severities, tool names, forbidden strings, links)
        run: python3 tools/validate.py

      - name: Command stays a thin dispatcher
        run: |
          body=$(awk 'BEGIN{n=0} /^---$/{n++; next} n>=2 && NF' commands/pow10-review.md | wc -l)
          test "$body" -le 15 || { echo "commands/pow10-review.md body has $body non-empty lines (max 15)"; exit 1; }

      - name: Fixtures compile
        run: |
          gofmt -e -l examples/violations.go
          python3 -m py_compile examples/violations.py

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !LICENSE

      - name: Dead-link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-redirects 5 './**/*.md'
          fail: true
